[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Estos avisos de pandas anticipan roturas reales (así falló CI con pandas 3): se tratan como error.
filterwarnings = [
    "error::FutureWarning",
    "error::pandas.errors.SettingWithCopyWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["venv", "output_enhanced"]

[tool.ruff.lint]
# Errores reales (sintaxis, nombres indefinidos, imports sin uso). Explícito para que
# CI no dependa de una configuración de ruff a nivel de usuario.
select = ["E4", "E7", "E9", "F"]
